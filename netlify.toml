# When UI Base directory is empty, this file applies (base = site).
# When UI Base = site, Netlify reads site/netlify.toml instead - see site/netlify.toml for publish override.

[build]
  base = "site"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
